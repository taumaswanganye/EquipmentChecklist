<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456"
     version="1.1" xmlns="http://www.w3.org/2000/svg">

  <!--
    Adaptive-icon FOREGROUND for the Pre-Checklist app.
    The csproj's <MauiIcon Color="#0e9488"> fills the background; this SVG
    is composited on top. Keep the artwork inside the safe zone (Android
    crops the outer ~25% on round / circular masks).

    The drawing is a stylised clipboard with a big check mark inside.
  -->

  <!-- Safe area is roughly 256x256 centered on a 456 canvas. -->

  <!-- Clipboard body -->
  <rect x="148" y="120" width="160" height="200" rx="14" ry="14"
        fill="none" stroke="#ffffff" stroke-width="14"/>

  <!-- Clip at the top -->
  <rect x="190" y="100" width="76" height="34" rx="6" ry="6"
        fill="#ffffff"/>

  <!-- Big checkmark -->
  <path d="M 178 220 L 218 260 L 290 178"
        fill="none" stroke="#ffffff" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"/>

</svg>
