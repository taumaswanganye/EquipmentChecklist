<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456"
     version="1.1" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">

  <!--
    Splash screen artwork for the Pre-Checklist mobile app.
    Replaces MAUI's default ".NET" wordmark. The MauiSplashScreen Color
    in the csproj sets the background — keep that and this artwork in sync.

    Anatomy:
      - Rounded teal badge with a white check + clipboard glyph at the top.
      - "PRE-CHECKLIST" wordmark below.
      - Subtitle for the mine name.
  -->

  <!-- Badge background — soft teal puck behind the icon -->
  <rect x="148" y="60" width="160" height="160" rx="28" ry="28" fill="#0e9488"/>

  <!-- Clipboard outline -->
  <rect x="184" y="100" width="88" height="100" rx="8" ry="8"
        fill="none" stroke="#ffffff" stroke-width="7"/>
  <!-- Clip at the top of the clipboard -->
  <rect x="208" y="88"  width="40" height="20" rx="4" ry="4"
        fill="#ffffff"/>

  <!-- Big checkmark inside the clipboard -->
  <path d="M 198 152 L 220 174 L 258 130"
        fill="none" stroke="#ffffff" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="228" y="288"
        font-family="Helvetica, Arial, sans-serif"
        font-size="44" font-weight="800"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="2">PRE-CHECKLIST</text>

  <!-- Subtitle -->
  <text x="228" y="320"
        font-family="Helvetica, Arial, sans-serif"
        font-size="16" font-weight="400"
        fill="#cbd5e1"
        text-anchor="middle"
        letter-spacing="3">BELFAST COAL MINE</text>

</svg>
